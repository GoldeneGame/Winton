<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#9b1c1c"/>
      <stop offset="1" stop-color="#3a0808"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#e0a93a"/>
      <stop offset="1" stop-color="#9c6a17"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#e2361b" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- écusson -->
  <circle cx="128" cy="128" r="122" fill="url(#bg)" stroke="#e0a93a" stroke-width="10"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#5e1010" stroke-width="3"/>

  <!-- souffle de feu -->
  <path d="M194 144 C212 130 230 138 246 120 C240 140 250 150 240 172 C228 162 214 168 194 160 Z" fill="url(#fire)"/>

  <!-- corne arrière (sombre) -->
  <path d="M112 96 L82 30 L128 86 Z" fill="#9c6a17" stroke="#2a1405" stroke-width="5" stroke-linejoin="round"/>

  <!-- tête et cou -->
  <path d="M62 232
           C58 196 62 150 92 112
           L56 46 L118 88
           C138 78 160 80 176 90
           L196 72 L192 98
           L224 110
           C236 114 238 128 226 132
           L180 136
           L204 150
           C190 162 164 168 146 164
           C132 178 128 206 136 232 Z"
        fill="url(#gold)" stroke="#2a1405" stroke-width="6" stroke-linejoin="round"/>

  <!-- crête le long du cou -->
  <path d="M66 196 L40 186 L70 176 L48 158 L80 150 L64 128 L92 124"
        fill="url(#gold)" stroke="#2a1405" stroke-width="5" stroke-linejoin="round"/>

  <!-- œil -->
  <path d="M150 104 C158 96 172 98 176 106 C168 112 158 112 150 104 Z" fill="#ff4a1a" stroke="#2a1405" stroke-width="3"/>
  <ellipse cx="164" cy="105" rx="2.5" ry="5" fill="#1a0a02"/>
  <!-- narine -->
  <path d="M214 116 C218 114 222 116 222 119" fill="none" stroke="#2a1405" stroke-width="4" stroke-linecap="round"/>
  <!-- dents -->
  <path d="M188 136 L192 145 L197 136 M174 136 L178 144 L183 136" fill="#fff8e0" stroke="#2a1405" stroke-width="2" stroke-linejoin="round"/>
  <!-- écailles -->
  <path d="M104 150 C112 146 118 150 120 158 M96 176 C104 172 110 176 112 184 M92 204 C100 200 106 204 108 212"
        fill="none" stroke="#7a4f10" stroke-width="4" stroke-linecap="round"/>
</svg>
